<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Struvae</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root{
    --paper: #F9FAF9; --paper-raised: #FFFFFF; --ink: #17181B; --ink-soft: #565B60;
    --muted: #90959A; --line: rgba(23,24,27,0.08); --line-strong: rgba(23,24,27,0.17);
    --capture: #2E9BC7;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:min(400px,100%); background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:32px 28px; }
  .brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
  .brand img{ width:30px; height:30px; border-radius:7px; }
  .brand span{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; text-align:center; margin-bottom:24px; }
  label{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  input{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong); font-size:14px; font-family:inherit; background:#fff; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--capture); }
  .field{ margin-bottom:16px; }
  button{ width:100%; padding:12px; border-radius:8px; border:none; background:var(--ink); color:var(--paper); font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{ background:rgba(178,74,61,.08); border:1px solid rgba(178,74,61,.3); color:#B24A3D; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; display:none; }
  .footer-link{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:18px; }
  .footer-link a{ color:var(--capture); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="struvae-mark.png" alt="Struvae"><span>Struvae</span></div>
    <h1>Log in</h1>

    <div class="error" id="errorBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="submitBtn">Log in</button>
    </form>

    <div class="footer-link">New here? <a href="signup.html">Create an account</a></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  function isOnStruvaeDomain() { return window.location.hostname.endsWith("struvae.com"); }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
    const domainPart = isOnStruvaeDomain() ? "; domain=.struvae.com" : "";
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/${domainPart}; SameSite=Lax; Secure`;
  }
  function removeCookie(name) {
    const domainPart = isOnStruvaeDomain() ? "; domain=.struvae.com" : "";
    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/${domainPart}`;
  }
  const cookieStorage = {
    getItem: (k) => getCookie(k),
    setItem: (k, v) => setCookie(k, v, 30),
    removeItem: (k) => removeCookie(k),
  };

  const SUPABASE_URL = "https://muansyegvsikodhpkrbo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YW5zeWVndnNpa29kaHBrcmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzcxNjEsImV4cCI6MjEwMzExMzE2MX0.4VDIRJg4MXsPIYfOfXiZ9gh5ypQKCqrfeLU7t-FJmo4";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: cookieStorage, storageKey: "struvae-auth-token", persistSession: true, autoRefreshToken: true },
  });

  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { error: signInError } = await client.auth.signInWithPassword({ email, password });
      if (signInError) throw signInError;

      const { data: userData } = await client.auth.getUser();
      const { data: pmRow, error: pmError } = await client
        .from("pms")
        .select("company_id")
        .eq("id", userData.user.id)
        .single();
      if (pmError || !pmRow) throw new Error("No company found for this account.");

      const { data: company, error: companyError } = await client
        .from("companies")
        .select("slug")
        .eq("id", pmRow.company_id)
        .single();
      if (companyError || !company) throw new Error("Could not find your company.");

      window.location.href = `https://daily.struvae.com/${company.slug}`;
    } catch (err) {
      errorBox.textContent = err.message || "Something went wrong. Please try again.";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
