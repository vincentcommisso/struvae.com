<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Struvae</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root{
    --paper: #F9FAF9; --paper-raised: #FFFFFF; --ink: #17181B; --ink-soft: #565B60;
    --muted: #90959A; --line: rgba(23,24,27,0.08); --line-strong: rgba(23,24,27,0.17);
    --capture: #2E9BC7; --capture-soft: rgba(46,155,199,.09);
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{ background: var(--paper); color: var(--ink); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:min(420px,100%); background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:32px 28px; }
  .brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
  .brand img{ width:30px; height:30px; border-radius:7px; }
  .brand span{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; text-align:center; margin-bottom:6px; }
  .sub{ text-align:center; color:var(--ink-soft); font-size:13.5px; margin-bottom:24px; }
  label{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  input{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong); font-size:14px; font-family:inherit; background:#fff; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--capture); }
  .field{ margin-bottom:16px; }
  .slug-row{ display:flex; align-items:center; gap:0; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .slug-prefix{ padding:10px 10px 10px 12px; background:var(--paper); color:var(--muted); font-size:13px; font-family:'IBM Plex Mono',monospace; white-space:nowrap; border-right:1px solid var(--line-strong); }
  .slug-row input{ border:none; border-radius:0; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .slug-row input:focus{ outline:none; }
  .slug-note{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .slug-note.taken{ color:#B24A3D; }
  .slug-note.ok{ color:#3F9E6D; }
  button{ width:100%; padding:12px; border-radius:8px; border:none; background:var(--ink); color:var(--paper); font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .error{ background:rgba(178,74,61,.08); border:1px solid rgba(178,74,61,.3); color:#B24A3D; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; display:none; }
  .footer-link{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:18px; }
  .footer-link a{ color:var(--capture); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/struvae-mark.png" alt="Struvae"><span>Struvae</span></div>
    <h1>Create your account</h1>
    <div class="sub">One login for every Struvae model, as they launch.</div>

    <div class="error" id="errorBox"></div>

    <form id="signupForm">
      <div class="field">
        <label for="companyName">Company name</label>
        <input type="text" id="companyName" placeholder="ABC Restoration" required>
      </div>

      <div class="field">
        <label for="slug">Your Struvae Daily URL</label>
        <div class="slug-row">
          <span class="slug-prefix">daily.struvae.com/</span>
          <input type="text" id="slug" placeholder="abc-restoration" required>
        </div>
        <div class="slug-note" id="slugNote"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>

      <button type="submit" id="submitBtn">Create account</button>
    </form>

    <div class="footer-link">Already have an account? <a href="/login">Log in</a></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- shared .struvae.com cookie storage (must match the Daily app's version) ----
  function isOnStruvaeDomain() { return window.location.hostname.endsWith("struvae.com"); }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : null;
  }
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
    const domainPart = isOnStruvaeDomain() ? "; domain=.struvae.com" : "";
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/${domainPart}; SameSite=Lax; Secure`;
  }
  function removeCookie(name) {
    const domainPart = isOnStruvaeDomain() ? "; domain=.struvae.com" : "";
    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/${domainPart}`;
  }
  const cookieStorage = {
    getItem: (k) => getCookie(k),
    setItem: (k, v) => setCookie(k, v, 30),
    removeItem: (k) => removeCookie(k),
  };

  const SUPABASE_URL = "https://muansyegvsikodhpkrbo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11YW5zeWVndnNpa29kaHBrcmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzcxNjEsImV4cCI6MjEwMzExMzE2MX0.4VDIRJg4MXsPIYfOfXiZ9gh5ypQKCqrfeLU7t-FJmo4";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: cookieStorage, storageKey: "struvae-auth-token", persistSession: true, autoRefreshToken: true },
  });

  function slugify(text) {
    return text.toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  const companyNameInput = document.getElementById("companyName");
  const slugInput = document.getElementById("slug");
  const slugNote = document.getElementById("slugNote");
  let slugEditedManually = false;

  companyNameInput.addEventListener("input", () => {
    if (!slugEditedManually) slugInput.value = slugify(companyNameInput.value);
    checkSlug();
  });
  slugInput.addEventListener("input", () => {
    slugEditedManually = true;
    slugInput.value = slugify(slugInput.value);
    checkSlug();
  });

  let slugCheckTimer;
  function checkSlug() {
    clearTimeout(slugCheckTimer);
    const slug = slugInput.value;
    if (!slug) { slugNote.textContent = ""; return; }
    slugNote.textContent = "Checking availability…";
    slugNote.className = "slug-note";
    slugCheckTimer = setTimeout(async () => {
      const { data } = await client.from("companies").select("id").eq("slug", slug).maybeSingle();
      if (data) {
        slugNote.textContent = "That URL is already taken — try another.";
        slugNote.className = "slug-note taken";
      } else {
        slugNote.textContent = "Available.";
        slugNote.className = "slug-note ok";
      }
    }, 400);
  }

  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");

  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating your account…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const companyName = companyNameInput.value.trim();
    const slug = slugInput.value;

    try {
      const { data: signUpData, error: signUpError } = await client.auth.signUp({ email, password });
      if (signUpError) throw signUpError;
      if (!signUpData.session) {
        throw new Error("Account created, but no active session — check that 'Confirm email' is turned off in Supabase for now.");
      }

      const { error: rpcError } = await client.rpc("create_company_and_pm", {
        p_company_name: companyName,
        p_slug: slug,
        p_product: "daily",
      });
      if (rpcError) throw rpcError;

      window.location.href = `https://daily.struvae.com/${slug}`;
    } catch (err) {
      errorBox.textContent = err.message || "Something went wrong. Please try again.";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
